<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Automation Script Launcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: url("static/test-code.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Glowing bubbles */
    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      pointer-events: none;
      animation: rise 20s infinite ease-in;
      filter: blur(4px);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), 0 0 30px rgba(255, 255, 255, 0.1);
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-1200px) scale(1.6);
        opacity: 0;
      }
    }

    .container {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      text-align: center;
      width: 400px;
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
      color: #ff00ff;
      text-shadow: 0 0 8px #ff00ff, 0 0 20px #ff00ff;
      animation: flicker 1.5s infinite alternate;
    }

    @keyframes flicker {
      0% {
        opacity: 1;
        text-shadow: 0 0 8px #ff00ff, 0 0 20px #ff00ff;
      }
      50% {
        opacity: 0.85;
        text-shadow: 0 0 10px #ff66ff, 0 0 25px #ff00ff;
      }
      100% {
        opacity: 1;
        text-shadow: 0 0 6px #cc00cc, 0 0 16px #ff00ff;
      }
    }

    label {
      font-size: 16px;
      margin-bottom: 10px;
      display: block;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
      margin-bottom: 20px;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
    }

    button {
      padding: 12px 28px;
      background: linear-gradient(135deg, #00ffcc, #00ccff);
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.9);
    }

    pre {
      text-align: left;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      color: #e0e0e0;
    }

    hr {
      border: 1px solid #555;
    }
  </style>
</head>
<body>

<!-- Glowing animated bubbles -->
<script>
  for (let i = 0; i < 25; i++) {
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    const size = Math.random() * 60 + 30;
    bubble.style.width = `${size}px`;
    bubble.style.height = `${size}px`;
    bubble.style.left = `${Math.random() * 100}%`;
    bubble.style.animationDuration = `${Math.random() * 10 + 10}s`;
    bubble.style.background = `radial-gradient(circle at 30% 30%, rgba(${200+Math.random()*55}, ${200+Math.random()*55}, 255, 0.4), rgba(255, 255, 255, 0.05))`;
    document.body.appendChild(bubble);
  }
</script>

<div class="container">
  <h1>Run Automation Script</h1>
  <form method="POST">
    <label for="script_number">Enter Script Number:</label>
    <input type="number" name="script_number" required>
    <button type="submit">Run Script</button>
  </form>

  {% if message %}
    <hr>
    <h3>Result:</h3>
    <pre>{{ message }}</pre>
  {% endif %}
</div>

</body>
</html>
